<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#0A0908" />

    <!-- LCP: start the hero photo download before React renders the <img>.
         Keep in sync with hero.image / hero.imageSrcset in src/content/hero.js. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-exterior-wordmark-v2.jpg"
      imagesrcset="/images/hero-exterior-wordmark-v2-960.jpg 960w, /images/hero-exterior-wordmark-v2.jpg 1774w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Self-hosted fonts — preloaded to avoid render-blocking font fetches. -->
    <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Fallback SEO — runtime Helmet (src/lib/seo.jsx) overrides these per page. -->
    <title>Ausflex Caravans — Built to Last, Built for Comfort</title>
    <meta
      name="description"
      content="Victoria's boutique caravan manufacturer. Australian-built caravans with heavy-duty chassis, a 5-year warranty and made-to-order layouts, crafted in Campbellfield."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ausflex Caravans — Built to Last, Built for Comfort" />
    <meta
      property="og:description"
      content="Australian-built caravans with heavy-duty chassis, a 5-year warranty and made-to-order layouts, crafted in Campbellfield, Victoria."
    />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ausflex Caravans — Built to Last, Built for Comfort" />
    <meta
      name="twitter:description"
      content="Australian-built caravans with heavy-duty chassis, a 5-year warranty and made-to-order layouts, crafted in Campbellfield, Victoria."
    />
    <meta name="twitter:image" content="/brand/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
