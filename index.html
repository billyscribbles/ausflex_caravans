<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#0c8c81" />

    <!-- Self-hosted fonts: drop woff2 files into public/fonts/, then uncomment
         and correct the paths to remove render-blocking font fetches. -->
    <!--
    <link rel="preload" href="/fonts/display.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/body.woff2" as="font" type="font/woff2" crossorigin />
    -->

    <!-- Fallback SEO — runtime Helmet (src/lib/seo.jsx) overrides these per page.
         Replace og-image.svg with a 1200x630 PNG before launch: most social
         platforms do not render SVG previews. -->
    <title>Foundation — Agency Starter Template</title>
    <meta name="description" content="Replace in src/config/site.config.js" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Foundation" />
    <meta property="og:description" content="Replace in src/config/site.config.js" />
    <meta property="og:image" content="/brand/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Foundation" />
    <meta name="twitter:description" content="Replace in src/config/site.config.js" />
    <meta name="twitter:image" content="/brand/og-image.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
